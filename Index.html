<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Eve Madam Ji 🎉</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff758c,#ff7eb3,#a18cd1,#fbc2eb);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:550px;
    text-align:center;
    padding:40px 25px;
    border-radius:30px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    color:white;
    z-index:10;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
}

.emoji{
    font-size:65px;
    animation:bounce 1.5s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

h1{
    font-size:clamp(2rem,8vw,4rem);
}

h2{
    color:#fff7b2;
    margin-top:8px;
}

p{
    margin:20px 0;
    line-height:1.6;
}

button{
    border:none;
    padding:14px 28px;
    border-radius:50px;
    font-size:1rem;
    cursor:pointer;
    margin:8px;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

.celebrate-btn{
    background:white;
    color:#ff4f81;
}

.surprise-btn{
    background:#fff7b2;
    color:#d63384;
}

#surprise{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,0.2);
    animation:pop 0.7s ease;
    font-size:1.1rem;
    font-weight:bold;
}

@keyframes pop{
    0%{
        opacity:0;
        transform:scale(0.5);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

.heart{
    position:fixed;
    bottom:-50px;
    font-size:25px;
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    0%{
        transform:translateY(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

@media(max-width:600px){
    .card{
        padding:30px 20px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="emoji">🎂</div>

    <h1>Happy Eve!</h1>
    <h2>Madam Ji 💖</h2>

    <p>
        Wishing you lots of happiness, smiles and beautiful memories.
        Have an amazing birthday eve! ✨🎉
    </p>

    <button class="celebrate-btn" onclick="celebrate()">
        🎉 Celebrate
    </button>

    <button class="surprise-btn" onclick="showSurprise()">
        🎁 Click for a Surprise
    </button>

    <div id="surprise">
        Abhi tho birthday ka suprise bhi bcha haii madam.. 😏🎂💖
    </div>

</div>

<script>

// Floating hearts
const hearts=["💖","💕","✨","🌸","💫"];

for(let i=0;i<20;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML=hearts[Math.floor(Math.random()*hearts.length)];
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(5+Math.random()*5)+"s";
    heart.style.animationDelay=Math.random()*5+"s";
    document.body.appendChild(heart);
}

// Confetti
function celebrate(){
    for(let i=0;i<180;i++){
        createConfetti();
    }
}

function createConfetti(){

    let confetti=document.createElement("div");

    confetti.style.position="fixed";
    confetti.style.width="10px";
    confetti.style.height="10px";
    confetti.style.left=Math.random()*100+"vw";
    confetti.style.top="-20px";
    confetti.style.background=
    `hsl(${Math.random()*360},100%,60%)`;

    confetti.style.zIndex="100";

    document.body.appendChild(confetti);

    let duration=2000+Math.random()*3000;

    confetti.animate([
        {
            transform:"translateY(0) rotate(0deg)"
        },
        {
            transform:
            `translateY(110vh)
             translateX(${Math.random()*200-100}px)
             rotate(720deg)`
        }
    ],{
        duration:duration,
        easing:"ease-out"
    });

    setTimeout(()=>{
        confetti.remove();
    },duration);
}

// Surprise button
function showSurprise(){

    document.getElementById("surprise").style.display="block";

    for(let i=0;i<120;i++){
        createConfetti();
    }
}

// Auto confetti on load
setTimeout(celebrate,1000);

</script>

</body>
</html>
